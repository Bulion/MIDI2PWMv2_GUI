name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      libcomm_ref:
        description: 'libcomm branch or tag'
        required: false
        default: 'master'

jobs:
  build-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout libcomm
        uses: actions/checkout@v4
        with:
          repository: Bulion/MIDI2PWMv2-libcomm
          ref: ${{ inputs.libcomm_ref || 'master' }}
          path: ../libcomm

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build flatbuffers-compiler \
            libfontconfig1-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libgl1-mesa-dev

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DGUI_BUILD_DESKTOP=ON
          -DGUI_BUILD_ESP32=OFF

      - name: Build
        run: cmake --build build

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: gui-desktop-linux
          path: build/desktop/gui_desktop

  release:
    needs: build-desktop
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Checkout libcomm
        uses: actions/checkout@v4
        with:
          repository: Bulion/MIDI2PWMv2-libcomm
          ref: ${{ inputs.libcomm_ref || 'master' }}
          path: ../libcomm

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build flatbuffers-compiler \
            libfontconfig1-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libgl1-mesa-dev

      - name: Build Release
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGUI_BUILD_DESKTOP=ON -DGUI_BUILD_ESP32=OFF
          cmake --build build

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: build/desktop/gui_desktop
